<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | BrightFix Electrical Solutions</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/script.js" defer></script>
</head>
<body>
  <header class="site-header">
    <div class="container nav-wrap">
      <div class="brand-block">
        <span class="brand-mark">BF</span>
        <h1>BrightFix Electrical Solutions</h1>
      </div>
      <nav class="main-nav" aria-label="Main navigation">
        <ul>
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About Us</a></li>
          <li><a href="services.html">Services</a></li>
          <li><a href="enquiry.html">Enquiry</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container page-content">
    <form id="contactForm" class="contact-form" action="https://formspree.io/f/your-form-id" method="POST">
      <p class="section-tag">Talk to us</p>
      <h2>Contact Us</h2>
      <label>Name
        <input type="text" id="contactName" name="name" required>
      </label>
      <label>Email
        <input type="email" id="contactEmail" name="email" required>
      </label>
      <label>Message
        <textarea id="contactMessage" name="message" required></textarea>
      </label>
      <button type="submit">Send Message</button>
      <p id="contactResponse" aria-live="polite"></p>
    </form>
  </main>

  <footer class="site-footer">
    <div class="container footer-inner">
      <p>&copy; 2026 BrightFix Electrical Solutions | All Rights Reserved</p>
    </div>
  </footer>
</body>
</html>
